<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator & Downloader</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Iconify CDN (Menggantikan fail mdi:heart.svg tempatan untuk elak 404) -->
  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-slate-200">
    <div class="flex items-center justify-center gap-2 mb-2">
      <h1 class="text-2xl font-bold text-slate-800">Penjana Kod QR</h1>
      <iconify-icon icon="mdi:heart" class="text-rose-500 text-2xl inline-block"></iconify-icon>
    </div>
    <p class="text-sm text-slate-500 mb-6">Masukkan pautan atau teks untuk menjana dan memuat turun kod QR anda.</p>

    <div class="space-y-4 text-left">
      <div>
        <label for="qr-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">
          Teks / URL
        </label>
        <input 
          type="text" 
          id="qr-input" 
          placeholder="https://contoh.com" 
          value="https://github.com"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
        />
      </div>

      <button 
        type="button"
        onclick="generateQRCode()" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-150 shadow-sm"
      >
        Jana Kod QR
      </button>
    </div>

    <!-- Kotak Paparan QR Code -->
    <div class="my-6 p-4 bg-slate-50 border border-dashed border-slate-300 rounded-xl flex items-center justify-center min-h-[240px]">
      <div id="qrcode" class="flex items-center justify-center"></div>
    </div>

    <!-- Butang Download -->
    <button 
      type="button"
      id="btn-download"
      onclick="downloadQRCode()" 
      class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-150 shadow-sm flex items-center justify-center gap-2"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
      Muat Turun Kod QR (PNG)
    </button>
  </div>

  <script>
    let qr = null;

    function generateQRCode() {
      const text = document.getElementById("qr-input").value.trim();
      const container = document.getElementById("qrcode");

      if (!text) {
        alert("Sila masukkan teks atau URL terlebih dahulu.");
        return;
      }

      // Kosongkan kod QR sedia ada
      container.innerHTML = "";

      // Bina QR Code baru
      qr = new QRCode(container, {
        text: text,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function downloadQRCode() {
      const container = document.getElementById("qrcode");
      
      // Ambil rujukan canvas atau img yang dihasilkan oleh pustaka
      const canvas = container.querySelector("canvas");
      const img = container.querySelector("img");

      let downloadUrl = "";

      if (canvas) {
        // Ambil terus dari canvas jika tersedia
        downloadUrl = canvas.toDataURL("image/png");
      } else if (img && img.src) {
        // Jika pustaka menjana elemen img
        downloadUrl = img.src;
      }

      if (!downloadUrl) {
        alert("Sila jana kod QR terlebih dahulu sebelum memuat turun.");
        return;
      }

      // Cipta elemen pautan sementara dan laksanakan muat turun
      const a = document.createElement("a");
      a.href = downloadUrl;
      a.download = "qrcode.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Jana secara automatik semasa laman mula dibuka
    window.addEventListener("DOMContentLoaded", () => {
      generateQRCode();
    });
  </script>
</body>
</html>
